name: Build and Push Docker Images (Multi-Arch)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================================
  # JOB 1: VALIDACIÓN DE CÓDIGO
  # ============================================================================
  # Ejecuta linting, type checking, y análisis del Dockerfile
  # Debe completarse con éxito antes de proceder con la construcción
  validate:
    name: Validate Code & Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ========================================================================
      # Configurar Node.js 22
      # ========================================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ========================================================================
      # Configurar pnpm con caché eficiente
      # ========================================================================
      - name: Setup pnpm
        uses: pnpm/action-setup@v2

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # ========================================================================
      # Instalar dependencias
      # ========================================================================
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ========================================================================
      # Ejecutar linting
      # ========================================================================
      - name: Run ESLint
        run: pnpm run lint
        continue-on-error: true

      # ========================================================================
      # Ejecutar type checking (si está configurado)
      # ========================================================================
      - name: Run TypeScript type checking
        run: pnpm run type-check
        continue-on-error: true

      # ========================================================================
      # Validar Dockerfile con Hadolint
      # ========================================================================
      - name: Run Hadolint (Dockerfile linter)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008
          # DL3008: Ignorar apt-get pin en imagen slim (no es crítico, imagen oficial de Node.js)

      # ========================================================================
      # Compilación local (opcional: verificar que compila antes de dockerizar)
      # ========================================================================
      - name: Build frontend and backend
        run: pnpm run build
        continue-on-error: true

  # ============================================================================
  # JOB 2: CONSTRUCCIÓN Y PUBLICACIÓN DE IMAGEN DOCKER
  # ============================================================================
  # Solo se ejecuta si el job "validate" tuvo éxito
  # Construye imagen multi-arquitectura y la sube a GHCR
  build-and-publish:
    name: Build and Push Docker Image
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push'  # Solo en push, no en PR
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ========================================================================
      # Preparar información de etiquetas (tags y metadata)
      # ========================================================================
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # ========================================================================
      # Configurar QEMU para compilación cruzada
      # ========================================================================
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # ========================================================================
      # Configurar Docker Buildx para multi-arquitectura
      # ========================================================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ========================================================================
      # Autenticar en GHCR usando token automático de GitHub
      # ========================================================================
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ========================================================================
      # Construir y publicar imagen multi-arquitectura
      # ========================================================================
      - name: Build and push Docker image (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache de GitHub Actions para capas reutilizables
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Información de construcción (útil para debugging)
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      # ========================================================================
      # Resumen de construcción
      # ========================================================================
      - name: Image push summary
        run: |
          echo "✅ Docker image successfully built and pushed to GHCR"
          echo ""
          echo "📦 Image tags:"
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n'
          echo ""
          echo "📋 Image digest: ${{ steps.build.outputs.digest }}"
          echo ""
          echo "🔗 View on GitHub Container Registry:"
          echo "   https://github.com/${{ github.repository }}/pkgs/container/$(echo ${{ github.repository }} | cut -d'/' -f2)"
