services:
  ui-dashboard:
    build: .
    image: huaweidashboard:latest
    container_name: huawei-ui-dashboard
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      # Volvemos a apuntar a tu carpeta local real en lugar de 'shared-storage'
      - ./storage:/app/storage
    command: ["npm", "run", "service:dashboard"]

  inverter-collector:
    build: .
    image: huaweidashboard:latest
    container_name: huawei-inverter-collector
    restart: unless-stopped
    depends_on:
      - ui-dashboard
    volumes:
      - ./storage:/app/storage  # Comparte la misma carpeta local real
    command: ["npm", "run", "service:inverter"]

  charger-service:
    build: .
    image: huaweidashboard:latest
    container_name: huawei-charger-service
    restart: unless-stopped
    depends_on:
      - ui-dashboard
    ports:
      - "9100:9100"
    volumes:
      - ./storage:/app/storage  # Comparte la misma carpeta local real
    command: ["npm", "run", "service:charger"]