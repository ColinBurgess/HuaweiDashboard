version: '3.8'

services:
  # --- MODO MONOLITO (Tradicional) ---
  huawei-monolith:
    build: .
    container_name: huawei-dashboard-monolith
    profiles: ["monolith"]
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3001}:3001"
      - "9100:9100"
    volumes:
      - ./history:/app/history
      - ./logs:/app/logs
      - ./data:/app/data
    env_file:
      - .env

  # --- MODO MODULAR (Microservicios) ---
  inverter-collector:
    build: .
    container_name: huawei-inverter-collector
    profiles: ["modular"]
    restart: unless-stopped
    command: npm run service:inverter
    volumes:
      - ./history:/app/history
      - ./logs:/app/logs
      - ./data:/app/data
    env_file:
      - .env

  charger-service:
    build: .
    container_name: huawei-charger-service
    profiles: ["modular"]
    restart: unless-stopped
    command: npm run service:charger
    ports:
      - "9100:9100"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    env_file:
      - .env

  ui-dashboard:
    build: .
    container_name: huawei-ui-dashboard
    profiles: ["modular"]
    restart: unless-stopped
    command: npm run service:dashboard
    ports:
      - "${APP_PORT:-3001}:3001"
    volumes:
      - ./history:/app/history
      - ./logs:/app/logs
      - ./data:/app/data
    env_file:
      - .env
