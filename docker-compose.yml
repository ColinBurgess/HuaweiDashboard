services:
  # =========================================================
  # MODO MONOLITO: Un solo contenedor con todos los servicios
  # =========================================================
  monolith:
    image: ghcr.io/colinburgess/huaweidashboard:latest
    container_name: huawei-monolith
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=Europe/Madrid
    profiles:
      - monolith
    ports:
      - "3001:3001"
      - "9100:9100"
    volumes:
      - ./storage:/app/storage
    command: ["pnpm", "start"]

  # =========================================================
  # MODO MODULAR: Servicios desacoplados (recomendado)
  # =========================================================

  ui-dashboard:
    image: ghcr.io/colinburgess/huaweidashboard:latest
    container_name: huawei-dashboard-service
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=Europe/Madrid
    profiles:
      - modular
    ports:
      - "3001:3001"
    volumes:
      - ./storage:/app/storage
    command: ["pnpm", "run", "service:dashboard"]

  inverter-collector:
    image: ghcr.io/colinburgess/huaweidashboard:latest
    container_name: huawei-collector-service
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=Europe/Madrid
      - SERVICE_ROLE=collector
    profiles:
      - modular
    depends_on:
      - ui-dashboard
    volumes:
      - ./storage:/app/storage
    command: ["pnpm", "run", "service:inverter"]

  charger-service:
    image: ghcr.io/colinburgess/huaweidashboard:latest
    container_name: huawei-charger-service
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=Europe/Madrid
    profiles:
      - modular
    depends_on:
      - ui-dashboard
    ports:
      - "9100:9100"
    volumes:
      - ./storage:/app/storage
    command: ["pnpm", "run", "service:charger"]

  # =========================================================
  # InfluxDB: Time-series database for telemetry
  # =========================================================
  influxdb:
    image: influxdb:2.7-alpine
    container_name: huawei-influxdb
    restart: unless-stopped
    environment:
      - TZ=Europe/Madrid
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_PASSWORD:-huawei2024}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUX_ORG:-huawei-dashboard}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUX_BUCKET:-telemetry}
      - DOCKER_INFLUXDB_INIT_RETENTION=0
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN}
    profiles:
      - dev
      - modular
      - monolith
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================
  # Watchtower: Automatic image updates (GitOps)
  # =========================================================
  watchtower:
    image: containrrr/watchtower:latest
    container_name: huawei-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Check registry every 10 minutes (600s) and cleanup old images to save disk space
    command: --interval 600 --cleanup
    profiles:
      - modular
      - monolith

volumes:
  influxdb_data: